<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPP Payment</title>
    <style>
        /* Preserved original styling structure */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .mobile { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            margin: 1rem;
        }
        .mobile > div:first-child { 
            font-size: 1.25rem; 
            font-weight: 600; 
            margin-bottom: 1.5rem; 
            color: #1a1a1a;
        }
        input[type="TEXT"] { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 1rem; 
            transition: border-color 0.2s;
        }
        input[type="TEXT"]:focus { 
            outline: none; 
            border-color: #00a884; 
        }
        .instructions { 
            margin: 1rem 0; 
            padding: 1rem; 
            background: #f8f9fa; 
            border-radius: 8px; 
            font-size: 0.875rem; 
            color: #555; 
            line-height: 1.5;
        }
        .button-container { 
            margin-top: 1.5rem; 
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #00a884; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { 
            background: #008f6f; 
        }
        button:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
        }
        .errors { 
            color: #d32f2f; 
            list-style: none; 
            margin: 0.5rem 0; 
            font-size: 0.875rem;
        }
        .errors li { 
            margin: 4px 0; 
        }
        /* Result display styles */
        .result-box { 
            margin-top: 1rem; 
            padding: 1rem; 
            border-radius: 8px; 
            display: none; 
            font-size: 0.9rem;
        }
        .result-box.success { 
            background: #e8f5e9; 
            color: #2e7d32; 
            border: 1px solid #a5d6a7;
        }
        .result-box.error { 
            background: #ffebee; 
            color: #c62828; 
            border: 1px solid #ef9a9a;
        }
        .result-box.pending { 
            background: #fff3e0; 
            color: #ef6c00; 
            border: 1px solid #ffcc80;
        }
        .spinner { 
            display: inline-block; 
            width: 16px; 
            height: 16px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 50%; 
            border-top-color: white; 
            animation: spin 0.8s linear infinite; 
            margin-right: 8px; 
            vertical-align: middle;
        }
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>

<form id="vendorFieldsForm" autocomplete="off">
    <div class="mobile">
        <div>Enter your details to continue</div>
        
        <div style="display:flex;flex-direction:column;gap:16px;margin-top:1rem;">
            <input type="TEXT" name="MSISDN" id="msisdnField" placeholder="Mobile Number" required value="">
            <input type="TEXT" name="SMARTCARD" placeholder="Smartcard Number" required value="">
        </div>
        
        <ul class="errors" id="errorList"></ul>
        
        <div class="instructions">
            Please ensure you have the following ready:
            <ul style="margin-left:1.2rem;margin-top:0.5rem;">
                <li>Your M-Pesa registered mobile phone</li>
                <li>Sufficient funds in your M-Pesa account</li>
                <li>You will receive an STK Push prompt to enter your PIN</li>
            </ul>
        </div>
        
        <div class="button-container">
            <button type="submit" id="continueBtn">
                <span id="btnText">Continue</span>
            </button>
        </div>
        
        <div id="resultBox" class="result-box"></div>
    </div>
</form>

<script>
    (function() {
        const form = document.getElementById('vendorFieldsForm');
        const msisdnField = document.getElementById('msisdnField');
        const continueBtn = document.getElementById('continueBtn');
        const btnText = document.getElementById('btnText');
        const errorList = document.getElementById('errorList');
        const resultBox = document.getElementById('resultBox');
        
        // Configuration - update with your backend URL
        const BACKEND_URL = '/api/initiate-payment'; // Change to your backend endpoint
        
        function showError(msg) {
            errorList.innerHTML = `<li>${msg}</li>`;
            resultBox.style.display = 'none';
        }
        
        function clearErrors() {
            errorList.innerHTML = '';
        }
        
        function showResult(message, type) {
            resultBox.className = 'result-box ' + type;
            resultBox.innerHTML = message;
            resultBox.style.display = 'block';
        }
        
        function setLoading(loading) {
            continueBtn.disabled = loading;
            if (loading) {
                btnText.innerHTML = '<span class="spinner"></span>Processing...';
            } else {
                btnText.textContent = 'Continue';
            }
        }
        
        function validatePhone(phone) {
            // Remove all non-digit characters
            const cleaned = phone.replace(/\D/g, '');
            
            // Kenyan number validation
            // Accepts: 07XXXXXXXX, 01XXXXXXXX, 2547XXXXXXXX, 2541XXXXXXXX, +2547XXXXXXXX
            if (cleaned.length === 10 && (cleaned.startsWith('07') || cleaned.startsWith('01'))) {
                return '254' + cleaned.substring(1);
            }
            if (cleaned.length === 12 && cleaned.startsWith('254') && (cleaned[3] === '7' || cleaned[3] === '1')) {
                return cleaned;
            }
            if (cleaned.length === 13 && cleaned.startsWith('254')) {
                // Handle cases like 25407... (with extra 0)
                return cleaned.replace(/^2540/, '254');
            }
            return null;
        }
        
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();
            
            const rawPhone = msisdnField.value.trim();
            const smartcard = form.SMARTCARD.value.trim();
            
            if (!rawPhone) {
                showError('Please enter your mobile number');
                return;
            }
            
            if (!smartcard) {
                showError('Please enter your Smartcard number');
                return;
            }
            
            const normalizedPhone = validatePhone(rawPhone);
            if (!normalizedPhone) {
                showError('Please enter a valid Kenyan mobile number (e.g. 0712345678 or 254712345678)');
                return;
            }
            
            setLoading(true);
            
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        phone_number: normalizedPhone,
                        smartcard_number: smartcard,
                        amount: 1 // Set your actual amount or read from page context
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Payment initiation failed');
                }
                
                // Display success result
                if (data.success || data.status === 'QUEUED' || data.resultCode === '0') {
                    showResult(
                        `<strong>STK Push Sent!</strong><br>
                        Check your phone (${rawPhone}) for the M-Pesa prompt.<br>
                        <small>Reference: ${data.reference || data.CheckoutRequestID || 'N/A'}</small>`,
                        'success'
                    );
                } else {
                    showResult(
                        `<strong>Request Status:</strong> ${data.status || 'Pending'}<br>
                        ${data.message || 'Please check your phone for the payment prompt.'}`,
                        'pending'
                    );
                }
                
            } catch (err) {
                console.error('Payment error:', err);
                showResult(
                    `<strong>Payment Failed</strong><br>${err.message}<br>
                    <small>Please try again or contact support.</small>`,
                    'error'
                );
            } finally {
                setLoading(false);
            }
        });
    })();
</script>

</body>
</html>
